name: Publish Check
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.2.3-rc.1'
        required: true
        type: string
      snapshot:
        description: 'Is snapshot version'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Validate Release Without Publishing
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Debug checked-out source
        shell: bash
        run: |
          echo "=== Workflow source ==="
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"
          echo "Workflow SHA: $GITHUB_SHA"

          echo "=== Checked-out source ==="
          git log -1 --format='%H %s'
          git status --short

          echo "=== Verification task definitions ==="
          git grep -n -E 'verifyReleaseVersion|DEBUG RELEASE_TAG|Tag .*does not match computed version' || true

      - name: Debug release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "RELEASE_TAG=$RELEASE_TAG"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"

          echo "Git branch:"
          git branch --show-current

          echo "Git HEAD:"
          git log -1 --format='%H %s'

          echo "Git tags pointing at HEAD:"
          git tag --points-at HEAD

          echo "Requested tag commit:"
          git rev-parse "refs/tags/$RELEASE_TAG^{commit}"

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_is_snapshot: 'false'
        run: |
          echo "=== SHELL DEBUG ==="
          echo "RELEASE_TAG=$RELEASE_TAG"
          ./gradlew --stop || true
          ./gradlew verifyReleaseVersion \
            --rerun-tasks \
            --no-build-cache \
            --no-configuration-cache \
            --no-daemon \
            --console=plain \
            --info

      - name: Build
        run: ./gradlew clean build --no-configuration-cache --no-daemon

      - name: Dry run Maven Central publication
        env:
          ORG_GRADLE_PROJECT_is_snapshot: 'false'
          ORG_GRADLE_PROJECT_is_local: 'false'
        run: ./gradlew publishToMavenCentral --dry-run --no-configuration-cache --no-daemon