name: Publish Check
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.2.3-rc.1'
        required: true
        type: string
      snapshot:
        description: 'Is snapshot version'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Validate Release Without Publishing
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify release version
        env:
          GITHUB_REF_NAME: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_is_snapshot: ${{ inputs.snapshot }}
        run: ./gradlew verifyReleaseVersion --no-configuration-cache --no-daemon