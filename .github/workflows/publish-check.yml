name: Publish Check
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.2.3-rc.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Validate Release Without Publishing
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi