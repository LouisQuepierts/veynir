name: Manual Maven Publish Test
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.2.3-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Validate tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_is_snapshot: 'false'
        run: |
          ./gradlew verifyReleaseVersion \
            --no-configuration-cache \
            --no-daemon \
            --console=plain

      - name: Build
        run: ./gradlew clean build --no-configuration-cache --no-daemon --console=plain

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_is_snapshot: 'false'
          ORG_GRADLE_PROJECT_is_local: 'false'
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew publishToMavenCentral \
            --no-configuration-cache \
            --no-daemon \
            --console=plain