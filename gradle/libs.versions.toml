[versions]
joml                    = "1.10.5"
guava                   = "32.1.2-jre"
gson                    = "2.10.1"
junit                   = "5.10.0"
fastutil                = "8.5.12"
slf4j-api               = "2.0.9"
slf4j-simple            = "1.7.30"
jetbrains-annotations   = "24.1.0"
jspecify                = "1.0.0"

[libraries]
joml                    = { group = "org.joml", name = "joml", version.ref = "joml" }
guava                   = { group = "com.google.guava", name = "guava", version.ref = "guava" }
gson                    = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
fastutil                = { group = "it.unimi.dsi", name = "fastutil", version.ref = "fastutil" }
slf4j-api               = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j-api" }
slf4j-simple            = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j-simple" }
junit-bom               = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter           = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
jetbrains-annotations   = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
jspecify                = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }