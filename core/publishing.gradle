artifacts {
    archives tasks.jar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java

            artifact tasks.named("sourcesJar")
            artifact tasks.named("javadocJar")

            pom {
                name = project.name
                description = "pipelined animation system"
                url = "https://github.com/LouisQuepierts/animata4j"

                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }

                developers {
                    developer {
                        id = "LouisQuepierts"
                        name = "Quepierts Andier"
                        email = "LouisQuepierts@Outlook.com"
                    }
                }
            }
        }
    }

    repositories {

    }
}