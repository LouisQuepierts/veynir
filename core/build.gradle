plugins {
    id 'java'
    id 'idea'
    id 'animata-codegen'
}

def getGitCommitCount() {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim().toInteger()
}

def buildNumber = getGitCommitCount()

group = 'net.quepierts.animata4j.core'
version = '1.0.0';

dependencies {
    implementation group: 'it.unimi.dsi', name: 'fastutil', version: fastutil_version
    implementation group: 'org.joml', name: 'joml', version: joml_version

    implementation group: 'org.slf4j', name: 'slf4j-api', version: slf4j_api_version
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_simple_version

    compileOnly project(':codegen-annotations')
}

jar {
    archiveBaseName = 'animata4j-core'
    archiveVersion = "${project.version}-${buildNumber}"
}

